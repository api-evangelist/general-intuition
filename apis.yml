aid: general-intuition
name: General Intuition
description: >-
  General Intuition is a frontier AI lab building large action foundation models
  that can perceive, predict, and act across space and time in both virtual and
  physical environments. Spun out of the gaming clip platform Medal, the company
  trains its spatial-temporal reasoning models on billions of action-labeled
  gameplay clips - recordings of exactly which buttons a player pressed and when -
  to teach AI agents how to move through and reason about the world. Its Mira
  world model powers applications across games, simulation, and robotics. Founded
  in 2025 and based in New York City, General Intuition has raised $454M total,
  including a $320M Series A at a $2.3B valuation, and is onboarding first partners
  to a commercial API ahead of a broader developer release.
